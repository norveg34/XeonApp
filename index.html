<script>

const BACKEND_URL = window.location.origin;

let currentUser = null;

let userPoints =
    parseInt(localStorage.getItem("xeon_points"), 10) || 1250;


// =========================================================
// OLDAL INDULÁSA
// =========================================================

document.addEventListener("DOMContentLoaded", async () => {

    updatePointsUI();

    await checkDiscordLogin();

});


// =========================================================
// DISCORD LOGIN
// =========================================================

function loginWithDiscord() {

    const button =
        document.getElementById("discordLoginButton");

    const status =
        document.getElementById("loginStatus");


    if (button) {

        button.disabled = true;

        button.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin mr-2"></i>
            Bejelentkezés...
        `;

    }


    if (status) {

        status.innerText =
            "Átirányítás a Discord bejelentkezéshez...";

    }


    /*
     * FONTOS:
     *
     * Nem használunk fetch() loginhoz.
     * A böngészőt közvetlenül az OAuth endpoint-ra
     * irányítjuk.
     */

    window.location.assign(
        `${BACKEND_URL}/auth/discord`
    );

}


// =========================================================
// DISCORD SESSION ELLENŐRZÉS
// =========================================================

async function checkDiscordLogin() {

    const loginScreen =
        document.getElementById("loginScreen");

    const appScreen =
        document.getElementById("appScreen");


    if (!loginScreen || !appScreen) {
        return;
    }


    /*
     * Először login képernyő.
     */

    loginScreen.classList.add("active");

    appScreen.classList.remove("active");


    /*
     * OAuth callback után lehet egy kis késés,
     * ezért maximum 5 alkalommal próbáljuk.
     */

    for (let attempt = 1; attempt <= 5; attempt++) {

        try {

            console.log(
                `Discord session ellenőrzés: ${attempt}/5`
            );


            const response =
                await fetch(
                    `${BACKEND_URL}/api/me`,
                    {
                        method: "GET",

                        credentials: "include",

                        cache: "no-store",

                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );


            console.log(
                "API /api/me státusz:",
                response.status
            );


            /*
             * Ha nincs login:
             * 401 / 403 esetén normálisan visszatérünk
             * a login képernyőre.
             */

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                currentUser = null;

                showLoginScreen();

                return;

            }


            if (!response.ok) {

                throw new Error(
                    `/api/me HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            console.log(
                "Discord session:",
                data
            );


            /*
             * Több lehetséges backend választ is elfogadunk.
             */

            const loggedIn =
                data.loggedIn === true ||
                data.authenticated === true ||
                data.logged_in === true;


            const user =
                data.user ||
                data.discordUser ||
                data.discord ||
                null;


            if (loggedIn && user) {

                currentUser = {

                    id:
                        user.id,

                    name:
                        user.global_name ||
                        user.globalName ||
                        user.username ||
                        user.name ||
                        "Discord User",

                    username:
                        user.username ||
                        user.name ||
                        "Discord User",

                    avatar:
                        user.avatar ||
                        null,

                    role:
                        user.role ||
                        "user"

                };


                /*
                 * Csak akkor mentjük el, ha ténylegesen
                 * a backend igazolta a bejelentkezést.
                 */

                localStorage.setItem(
                    "xeon_user",
                    JSON.stringify(currentUser)
                );


                console.log(
                    "SIKERES DISCORD LOGIN:",
                    currentUser
                );


                showAppScreen();


                return;

            }


            /*
             * Ha a backend 200-at ad, de még nincs
             * user adat, várunk és újrapróbáljuk.
             */

            console.log(
                "Backend válaszolt, de nincs aktív Discord session."
            );


        } catch (error) {

            console.error(
                "Discord session hiba:",
                error
            );

        }


        /*
         * Következő próbálkozás előtt várunk.
         */

        if (attempt < 5) {

            await sleep(700);

        }

    }


    /*
     * Ha egyik próbálkozás sem sikerült,
     * nincs aktív session.
     */

    currentUser = null;

    localStorage.removeItem("xeon_user");

    showLoginScreen();

}


// =========================================================
// APP MEGJELENÍTÉSE
// =========================================================

function showAppScreen() {

    const loginScreen =
        document.getElementById("loginScreen");

    const appScreen =
        document.getElementById("appScreen");


    if (loginScreen) {

        loginScreen.classList.remove("active");

    }


    if (appScreen) {

        appScreen.classList.add("active");

    }


    updateUserUI();


    console.log(
        "XeonApp megnyitva:",
        currentUser
    );

}


// =========================================================
// LOGIN MEGJELENÍTÉSE
// =========================================================

function showLoginScreen() {

    const loginScreen =
        document.getElementById("loginScreen");

    const appScreen =
        document.getElementById("appScreen");


    if (loginScreen) {

        loginScreen.classList.add("active");

    }


    if (appScreen) {

        appScreen.classList.remove("active");

    }


    const button =
        document.getElementById("discordLoginButton");


    const status =
        document.getElementById("loginStatus");


    if (button) {

        button.disabled = false;

        button.innerHTML = `
            <i class="fa-brands fa-discord mr-2"></i>
            Bejelentkezés Discorddal
        `;

    }


    if (status) {

        status.innerText =
            "A belépés a Discord hivatalos OAuth2 rendszerén keresztül történik.";

    }

}


// =========================================================
// LOGOUT
// =========================================================

async function logout() {

    try {

        await fetch(
            `${BACKEND_URL}/auth/logout`,
            {
                method: "POST",

                credentials: "include",

                cache: "no-store",

                headers: {
                    "Accept": "application/json"
                }
            }
        );

    } catch (error) {

        console.error(
            "Logout hiba:",
            error
        );

    }


    currentUser = null;

    localStorage.removeItem("xeon_user");

    showLoginScreen();

}


// =========================================================
// USER UI
// =========================================================

function updateUserUI() {

    if (!currentUser) {
        return;
    }


    const userName =
        document.getElementById("userName");


    const profileName =
        document.getElementById("profileName");


    const profileRole =
        document.getElementById("profileRole");


    if (userName) {

        userName.textContent =
            currentUser.name;

    }


    if (profileName) {

        profileName.textContent =
            currentUser.name;

    }


    if (profileRole) {

        if (currentUser.role === "admin") {

            profileRole.textContent =
                "Rendszergazda (Admin)";

        } else {

            profileRole.textContent =
                "Discord felhasználó";

        }

    }


    updatePointsUI();


    // =====================================================
    // AVATAR
    // =====================================================

    const profileAvatar =
        document.getElementById("profileAvatar");


    if (
        profileAvatar &&
        currentUser.id &&
        currentUser.avatar
    ) {

        profileAvatar.innerHTML = "";

        const img =
            document.createElement("img");


        img.src =
            `https://cdn.discordapp.com/avatars/${encodeURIComponent(currentUser.id)}/${encodeURIComponent(currentUser.avatar)}.png?size=128`;


        img.alt =
            "Discord avatar";


        img.className =
            "w-full h-full object-cover";


        img.onerror = () => {

            profileAvatar.innerHTML =
                `<i class="fa-brands fa-discord"></i>`;

        };


        profileAvatar.appendChild(img);

    }


    // =====================================================
    // ADMIN
    // =====================================================

    const adminPanel =
        document.getElementById("adminPanel");


    const adminSchedulePanel =
        document.getElementById("adminSchedulePanel");


    const adminAddBtnContainer =
        document.getElementById("adminAddBtnContainer");


    if (currentUser.role === "admin") {

        if (adminPanel) {

            adminPanel.classList.remove("hidden");

        }


        if (adminSchedulePanel) {

            adminSchedulePanel.classList.remove("hidden");

        }


        if (adminAddBtnContainer) {

            adminAddBtnContainer.innerHTML = `

                <button
                    onclick="toggleAdminPanel()"
                    class="text-xs bg-[#5865F2] px-3 py-1.5 rounded-xl text-white font-bold"
                >

                    <i class="fa-solid fa-plus mr-1"></i>

                    Új Játék

                </button>

            `;

        }

    } else {

        if (adminPanel) {

            adminPanel.classList.add("hidden");

        }


        if (adminSchedulePanel) {

            adminSchedulePanel.classList.add("hidden");

        }


        if (adminAddBtnContainer) {

            adminAddBtnContainer.innerHTML = "";

        }

    }

}


// =========================================================
// PONTOK
// =========================================================

function updatePointsUI() {

    const points =
        document.getElementById("userPoints");


    if (points) {

        points.textContent =
            userPoints.toLocaleString("hu-HU") +
            " Pont";

    }

}


// =========================================================
// TAB
// =========================================================

function switchTab(tabId) {

    document
        .querySelectorAll(".tab-content")
        .forEach(element => {

            element.classList.remove("active");

        });


    const target =
        document.getElementById(
            "tab-" + tabId
        );


    if (target) {

        target.classList.add("active");

    }


    document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

            button.classList.remove(
                "text-[#5865F2]"
            );

            button.classList.add(
                "text-gray-400"
            );


            if (
                button.dataset.target === tabId
            ) {

                button.classList.remove(
                    "text-gray-400"
                );

                button.classList.add(
                    "text-[#5865F2]"
                );

            }

        });


    window.scrollTo(0, 0);

}


// =========================================================
// NAPI BÓNUSZ
// =========================================================

function claimDailyBonus() {

    userPoints += 250;

    localStorage.setItem(
        "xeon_points",
        userPoints
    );

    updatePointsUI();

    alert(
        "🎉 Sikeresen begyűjtötted a napi 250 bónusz pontot!"
    );

}


// =========================================================
// ADMIN PANEL
// =========================================================

function toggleAdminPanel() {

    if (
        !currentUser ||
        currentUser.role !== "admin"
    ) {

        return;

    }


    const panel =
        document.getElementById("adminPanel");


    if (panel) {

        panel.classList.toggle("hidden");

    }

}


// =========================================================
// MENETREND
// =========================================================

function addScheduleItem() {

    if (
        !currentUser ||
        currentUser.role !== "admin"
    ) {

        alert(
            "Nincs admin jogosultságod."
        );

        return;

    }


    const day =
        document.getElementById("schedDay")
        .value
        .trim();


    const game =
        document.getElementById("schedGame")
        .value
        .trim();


    if (!day || !game) {

        alert(
            "Töltsd ki mindkét mezőt!"
        );

        return;

    }


    const list =
        document.getElementById("scheduleList");


    const item =
        document.createElement("div");


    item.className =
        "glass p-3.5 rounded-xl flex justify-between items-center";


    const content =
        document.createElement("div");


    const dayElement =
        document.createElement("div");


    dayElement.className =
        "text-xs text-indigo-400 font-bold";


    dayElement.textContent =
        day;


    const gameElement =
        document.createElement("div");


    gameElement.className =
        "text-sm font-semibold text-white mt-0.5";


    gameElement.textContent =
        game;


    content.appendChild(dayElement);

    content.appendChild(gameElement);


    const badge =
        document.createElement("span");


    badge.className =
        "text-[10px] bg-[#5865F2] text-white px-2.5 py-1 rounded-lg";


    badge.textContent =
        "Admin";


    item.appendChild(content);

    item.appendChild(badge);


    list.prepend(item);


    document.getElementById(
        "schedDay"
    ).value = "";


    document.getElementById(
        "schedGame"
    ).value = "";


    alert(
        "Menetrend frissítve!"
    );

}


// =========================================================
// JÁTÉK AJÁNLÁS
// =========================================================

function addGameRecommendation() {

    if (
        !currentUser ||
        currentUser.role !== "admin"
    ) {

        alert(
            "Nincs admin jogosultságod."
        );

        return;

    }


    const title =
        document.getElementById("gameTitle")
        .value
        .trim();


    const img =
        document.getElementById("gameImg")
        .value
        .trim() ||
        "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500";


    const link =
        document.getElementById("gameLink")
        .value
        .trim() ||
        "https://www.twitch.tv/xeonskorpofficial";


    if (!title) {

        alert(
            "Add meg a játék címét!"
        );

        return;

    }


    const container =
        document.getElementById(
            "gameListContainer"
        );


    const card =
        document.createElement("div");


    card.className =
        "glass rounded-2xl overflow-hidden flex flex-col justify-between";


    const top =
        document.createElement("div");


    const image =
        document.createElement("div");


    image.className =
        "h-44 bg-gray-800 bg-cover bg-center";


    image.style.backgroundImage =
        `url("${img.replaceAll('"', '\\"')}")`;


    const content =
        document.createElement("div");


    content.className =
        "p-3";


    const titleElement =
        document.createElement("h3");


    titleElement.className =
        "font-bold text-xs text-white";


    titleElement.textContent =
        title;


    const author =
        document.createElement("p");


    author.className =
        "text-[10px] text-indigo-400 mt-0.5";


    author.textContent =
        "Ajánlja: " + currentUser.name;


    content.appendChild(titleElement);

    content.appendChild(author);


    top.appendChild(image);

    top.appendChild(content);


    const bottom =
        document.createElement("div");


    bottom.className =
        "p-3 pt-0 flex space-x-2";


    const linkButton =
        document.createElement("a");


    linkButton.href = link;

    linkButton.target = "_blank";

    linkButton.rel =
        "noopener noreferrer";


    linkButton.className =
        "flex-1 bg-[#5865F2]/80 hover:bg-[#5865F2] text-center text-white text-[11px] font-bold py-1.5 rounded-xl";


    linkButton.innerHTML =
        `<i class="fa-solid fa-globe mr-1"></i>Link`;


    const likeButton =
        document.createElement("button");


    likeButton.className =
        "bg-gray-800 hover:bg-gray-700 px-3 text-red-400 text-[11px] font-bold py-1.5 rounded-xl";


    likeButton.innerHTML =
        `<i class="fa-solid fa-heart mr-1"></i><span>0</span>`;


    likeButton.onclick =
        function () {

            likeGame(this);

        };


    bottom.appendChild(linkButton);

    bottom.appendChild(likeButton);


    card.appendChild(top);

    card.appendChild(bottom);


    container.prepend(card);


    document.getElementById(
        "gameTitle"
    ).value = "";


    document.getElementById(
        "gameImg"
    ).value = "";


    document.getElementById(
        "gameLink"
    ).value = "";


    toggleAdminPanel();

}


// =========================================================
// LIKE
// =========================================================

function likeGame(button) {

    const span =
        button.querySelector("span");


    if (!span) {
        return;
    }


    span.textContent =
        parseInt(span.textContent || "0", 10) + 1;

}


// =========================================================
// SHOP
// =========================================================

function buyItem(cost) {

    if (userPoints >= cost) {

        userPoints -= cost;


        localStorage.setItem(
            "xeon_points",
            userPoints
        );


        updatePointsUI();


        alert(
            "Sikeres beváltás! A kódot hamarosan megkapod Discordon."
        );

    } else {

        alert(
            "Nincs elég pontod!"
        );

    }

}


// =========================================================
// CHAT
// =========================================================

function sendChatMessage() {

    const input =
        document.getElementById("chatInput");


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (!currentUser) {

        alert(
            "Először jelentkezz be!"
        );

        return;

    }


    const chatContainer =
        document.getElementById("chatMessages");


    const msgDiv =
        document.createElement("div");


    msgDiv.className =
        "text-gray-300";


    const username =
        document.createElement("span");


    username.className =
        "font-bold text-[#5865F2]";


    username.textContent =
        currentUser.name + ":";


    msgDiv.appendChild(username);


    msgDiv.appendChild(
        document.createTextNode(
            " " + text
        )
    );


    chatContainer.appendChild(msgDiv);


    chatContainer.scrollTop =
        chatContainer.scrollHeight;


    input.value = "";

}


// =========================================================
// PUSH
// =========================================================

function requestPushPermission() {

    if (!("Notification" in window)) {

        alert(
            "A böngésződ nem támogatja a push értesítéseket."
        );

        return;

    }


    Notification
        .requestPermission()
        .then(permission => {

            if (permission === "granted") {

                alert(
                    "🔔 Push értesítések engedélyezve!"
                );

            } else {

                alert(
                    "A push értesítések nincsenek engedélyezve."
                );

            }

        });

}


// =========================================================
// SEGÉDFÜGGVÉNY
// =========================================================

function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}

</script>
